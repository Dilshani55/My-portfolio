      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Runs before React loads so the page never flashes the wrong theme.
      Order: saved choice -> system preference -> dark.
    -->
    <script>
      (function () {
        var isDark = true;
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            isDark = saved === 'dark';
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } catch (e) {}
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
